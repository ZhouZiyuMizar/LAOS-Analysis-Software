<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradient for main hexagon -->
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for curve -->
    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle (optional) -->
  <circle cx="128" cy="128" r="120" fill="#FAFAFA" filter="url(#shadow)"/>

  <!-- Hexagon structure (benzene ring style) -->
  <g transform="translate(128, 128)">
    <!-- Outer hexagon -->
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35"
             fill="none" stroke="url(#hexGradient)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Inner bonds (alternating double bonds suggestion) -->
    <line x1="0" y1="-52" x2="0" y2="-28" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="-26" x2="30" y2="-17" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="26" x2="30" y2="17" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="52" x2="0" y2="28" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
    <line x1="-45" y1="26" x2="-30" y2="17" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
    <line x1="-45" y1="-26" x2="-30" y2="-17" stroke="#2196F3" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Lissajous curve inside hexagon (stress-strain representation) -->
  <g transform="translate(128, 128)">
    <!-- Main oscillating curve -->
    <path d="M -40,0
             Q -30,-25 -20,0
             Q -10,25 0,0
             Q 10,-25 20,0
             Q 30,25 40,0"
          fill="none" stroke="url(#curveGradient)" stroke-width="5" stroke-linecap="round"/>
    <!-- Secondary curve (phase shifted) -->
    <path d="M -40,0
             Q -30,20 -20,0
             Q -10,-20 0,0
             Q 10,20 20,0
             Q 30,-20 40,0"
          fill="none" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.5"
          transform="translate(0, 8)"/>
  </g>

  <!-- Corner nodes (atoms) -->
  <g fill="#1976D2">
    <circle cx="128" cy="58" r="8"/>
    <circle cx="188.6" cy="93" r="8"/>
    <circle cx="188.6" cy="163" r="8"/>
    <circle cx="128" cy="198" r="8"/>
    <circle cx="67.4" cy="163" r="8"/>
    <circle cx="67.4" cy="93" r="8"/>
  </g>

  <!-- Small accent dots -->
  <g fill="#FF5722">
    <circle cx="128" cy="128" r="4"/>
    <circle cx="108" cy="118" r="2.5"/>
    <circle cx="148" cy="138" r="2.5"/>
  </g>
</svg>