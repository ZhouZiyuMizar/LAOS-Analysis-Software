<?xml version="1.0" encoding="UTF-8"?>
<!-- Dark theme version -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="hexGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="curveGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8A65;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFAB91;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8A65;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="256" height="256" rx="32" fill="#1E1E1E"/>

  <!-- Hexagon structure -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35"
             fill="none" stroke="url(#hexGradientDark)" stroke-width="10" stroke-linejoin="round"/>

    <!-- Inner bonds -->
    <line x1="0" y1="-50" x2="0" y2="-30" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="43" y1="-25" x2="28" y2="-16" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="43" y1="25" x2="28" y2="16" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="50" x2="0" y2="30" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="-43" y1="25" x2="-28" y2="16" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
    <line x1="-43" y1="-25" x2="-28" y2="-16" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Lissajous curve -->
  <g transform="translate(128, 128)">
    <path d="M -40,0 Q -30,-25 -20,0 Q -10,25 0,0 Q 10,-25 20,0 Q 30,25 40,0"
          fill="none" stroke="url(#curveGradientDark)" stroke-width="4" stroke-linecap="round"/>
    <path d="M -40,0 Q -30,20 -20,0 Q -10,-20 0,0 Q 10,20 20,0 Q 30,-20 40,0"
          fill="none" stroke="#FF8A65" stroke-width="2" stroke-linecap="round" opacity="0.4"
          transform="translate(0, 8)"/>
  </g>

  <!-- Corner nodes -->
  <g fill="#64B5F6">
    <circle cx="128" cy="58" r="7"/>
    <circle cx="188.6" cy="93" r="7"/>
    <circle cx="188.6" cy="163" r="7"/>
    <circle cx="128" cy="198" r="7"/>
    <circle cx="67.4" cy="163" r="7"/>
    <circle cx="67.4" cy="93" r="7"/>
  </g>

  <!-- Accent dots -->
  <g fill="#FF8A65">
    <circle cx="128" cy="128" r="3.5"/>
  </g>
</svg>